name: mama-capture

on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install puppeteer
        run: npm i puppeteer@23 --no-audit --no-fund
      - name: Capture rendered DOM
        run: node tools/mama-capture.js
      - name: Commit results
        run: |
          git config user.name "capture-bot"
          git config user.email "capture-bot@users.noreply.github.com"
          git add capture/out
          git commit -m "capture: mamaduanju $(date -u +%Y%m%dT%H%M%SZ)" || echo "no changes"
          git push
