name: mama-capture

on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install puppeteer
        run: npm i puppeteer@23 --no-audit --no-fund
      - name: Capture rendered DOM
        run: |
          node tools/mama-capture.js || echo 'mama-capture failed'
          node tools/mama-theater.js || echo 'mama-theater failed'
          node tools/mama-player-src.js || echo 'player-src failed'
          node tools/mama-player-chunks.js || echo 'player-chunks failed'
          node tools/yeguo-capture.js || echo 'yeguo failed'
      - name: Keep rendered HTML as artifact only
        uses: actions/upload-artifact@v4
        with:
          name: mama-html
          path: |
            capture/out/*.html
            capture/out/src/*.js
            capture/out/src2/*.js
            capture/out/yeguo-*.html
          retention-days: 3
      - name: Commit probe JSON only
        run: |
          git config user.name "capture-bot"
          git config user.email "capture-bot@users.noreply.github.com"
          git add capture/out/*.json
          git commit -m "capture: mamaduanju $(date -u +%Y%m%dT%H%M%SZ)" || echo "no changes"
          git push
